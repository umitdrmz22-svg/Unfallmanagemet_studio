name: Qualitätsprüfung

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  qa3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript-Syntax prüfen
        run: |
          node --check config.js
          for file in src/bootstrap.js src/app.js src/storage.js src/rules.js; do node --input-type=module --check < "$file"; done
      - name: Deploy-Lizenzvertrag prüfen
        run: |
          test -f .github/workflows/ehs-module-gate.yml
          grep -Fq 'defidev-legal/ehs-entitlement-gate.js' .github/workflows/ehs-module-gate.yml
          grep -Fq 'ehs_unfallmanagement_monthly' .github/workflows/ehs-module-gate.yml
      - name: Regeltests dreimal ausführen
        run: |
          for PASS in 1 2 3; do echo "QA pass $PASS"; node tests/rules.test.mjs; done
